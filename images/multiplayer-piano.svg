<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Multiplayer piano — several players pressing keys in one shared room">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdce2"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bg)"/>

  <!-- white keys -->
  <g>
    <rect x="20"  y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="48"  y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="76"  y="62" width="27" height="100" rx="3" fill="#7dd8c6"/>
    <rect x="104" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="132" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="160" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="188" y="62" width="27" height="100" rx="3" fill="#ff8f6b"/>
    <rect x="216" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="244" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
    <rect x="272" y="62" width="27" height="100" rx="3" fill="url(#white)"/>
  </g>

  <!-- black keys -->
  <g fill="#15151a">
    <rect x="39"  y="62" width="17" height="62" rx="2.5"/>
    <rect x="67"  y="62" width="17" height="62" rx="2.5"/>
    <rect x="123" y="62" width="17" height="62" rx="2.5" fill="#a78bfa"/>
    <rect x="151" y="62" width="17" height="62" rx="2.5"/>
    <rect x="179" y="62" width="17" height="62" rx="2.5"/>
    <rect x="235" y="62" width="17" height="62" rx="2.5"/>
    <rect x="263" y="62" width="17" height="62" rx="2.5"/>
  </g>

  <!-- live cursors, one per player -->
  <g>
    <path d="M86 34 L86 52 L91 47 L95 55 L98 53 L94 46 L100 46 Z" fill="#7dd8c6"/>
    <rect x="102" y="32" width="38" height="15" rx="7.5" fill="#7dd8c6"/>
    <text x="121" y="43" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0d0d0f" text-anchor="middle">ayan</text>

    <path d="M198 24 L198 42 L203 37 L207 45 L210 43 L206 36 L212 36 Z" fill="#ff8f6b"/>
    <rect x="214" y="22" width="34" height="15" rx="7.5" fill="#ff8f6b"/>
    <text x="231" y="33" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2a1008" text-anchor="middle">mia</text>

    <path d="M132 168 L132 186 L137 181 L141 189 L144 187 L140 180 L146 180 Z" fill="#a78bfa"/>
    <rect x="148" y="166" width="32" height="15" rx="7.5" fill="#a78bfa"/>
    <text x="164" y="177" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#16092e" text-anchor="middle">jon</text>
  </g>
</svg>
